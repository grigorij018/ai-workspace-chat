name: Hackathon CI

on:
  push:
    branches:
      - develop
      - main
      - chore/infra-release-readme
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint:
    name: Lint and Secret Discipline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install frontend dependencies
        run: npm ci --force

      - name: Install backend lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.15.5"

      - name: Check .env.example for committed secrets
        run: bash ./scripts/check-no-secrets.sh

      - name: Frontend lint
        run: npx eslint .

      - name: Frontend typecheck
        run: npm run check

      - name: Backend lint
        run: ruff check backend

  backend-tests:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend test dependencies
        run: uv sync --frozen --group dev

      - name: Run targeted pytest smoke
        run: uv run pytest -q backend/open_webui/test/util/test_redis.py

  frontend-smoke:
    name: Frontend Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Prepare env file
        run: |
          cp .env.example .env
          printf '\nOPENAI_API_KEY=dummy-ci-key\nWEBUI_SECRET_KEY=ci-secret-key\n' >> .env

      - name: Start docker stack
        run: docker compose --env-file .env up -d --build --remove-orphans

      - name: Wait for app health
        run: |
          for _ in $(seq 1 60); do
            if curl --silent --fail http://localhost:3000/health | grep -q '"status":true'; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs open-webui
          exit 1

      - name: Install frontend dependencies
        run: npm ci --force

      - name: Run Cypress smoke
        env:
          CYPRESS_baseUrl: http://localhost:3000
        run: npx cypress run --spec cypress/e2e/smoke.cy.ts

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop docker stack
        if: always()
        run: docker compose --env-file .env down --remove-orphans
